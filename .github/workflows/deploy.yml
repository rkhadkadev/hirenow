name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hirenow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Apache config
        run: |
          {
            echo 'APACHE_CONFIG_B64<<EOF'
            base64 -w 0 apache/hirenow.buildprocure.com.conf
            echo
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          APACHE_CONFIG_B64: ${{ env.APACHE_CONFIG_B64 }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,CONTACT_EMAIL,MAIL_FROM,MAIL_FROM_NAME,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,APACHE_CONFIG_B64
          script: |
            set -e
            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            elif sudo -n true 2>/dev/null; then
              SUDO="sudo -n"
            else
              echo "Deploy user must be root or have passwordless sudo."
              exit 1
            fi

            if [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_TOKEN secret is missing or empty."
              exit 1
            fi

            if [ -z "$GHCR_USERNAME" ]; then
              echo "GHCR_USERNAME is missing."
              exit 1
            fi

            echo "Logging in to GHCR as: $GHCR_USERNAME"
            echo "GHCR_TOKEN length: ${#GHCR_TOKEN}"

            $SUDO mkdir -p /opt/hirenow
            {
              printf 'CONTACT_EMAIL=%s\n' "${CONTACT_EMAIL:-info@hirenow.buildprocure.com}"
              printf 'MAIL_FROM=%s\n' "${MAIL_FROM:-no-reply@hirenow.buildprocure.com}"
              printf 'MAIL_FROM_NAME=%s\n' "${MAIL_FROM_NAME:-HireNow Website}"
              printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
              printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
              printf 'SMTP_SECURE=%s\n' "${SMTP_SECURE:-tls}"
              printf 'SMTP_USER=%s\n' "$SMTP_USER"
              printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            } > /tmp/hirenow.env
            $SUDO install -m 600 /tmp/hirenow.env /opt/hirenow/.env
            rm -f /tmp/hirenow.env

            printf '%s\n' "$GHCR_TOKEN" > /tmp/ghcr_token
            $SUDO docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin < /tmp/ghcr_token
            rm -f /tmp/ghcr_token
            $SUDO docker pull "$IMAGE_NAME:latest"
            $SUDO docker stop hirenow || true
            $SUDO docker rm hirenow || true
            $SUDO docker run -d \
              --name hirenow \
              --restart unless-stopped \
              -p 3100:80 \
              --env-file /opt/hirenow/.env \
              "$IMAGE_NAME:latest"

            if command -v apache2ctl >/dev/null 2>&1 && command -v a2ensite >/dev/null 2>&1; then
              if [ -z "$APACHE_CONFIG_B64" ]; then
                echo "Apache config content is missing."
                exit 1
              fi

              printf '%s' "$APACHE_CONFIG_B64" | base64 -d > /tmp/hirenow.buildprocure.com.conf
              $SUDO install -m 644 /tmp/hirenow.buildprocure.com.conf /etc/apache2/sites-available/hirenow.buildprocure.com.conf
              $SUDO a2enmod proxy proxy_http
              $SUDO a2ensite hirenow.buildprocure.com.conf
              $SUDO apache2ctl configtest
              $SUDO systemctl reload apache2
            else
              echo "Apache was not found on the host; skipped vhost installation."
            fi

            rm -f /tmp/hirenow.buildprocure.com.conf
