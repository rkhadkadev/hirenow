name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hirenow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,CONTACT_EMAIL,MAIL_FROM,MAIL_FROM_NAME,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD
          script: |
            set -e
            sudo mkdir -p /opt/hirenow
            {
              printf 'CONTACT_EMAIL=%s\n' "${CONTACT_EMAIL:-info@hirenow.buildprocure.com}"
              printf 'MAIL_FROM=%s\n' "${MAIL_FROM:-no-reply@hirenow.buildprocure.com}"
              printf 'MAIL_FROM_NAME=%s\n' "${MAIL_FROM_NAME:-HireNow Website}"
              printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
              printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
              printf 'SMTP_SECURE=%s\n' "${SMTP_SECURE:-tls}"
              printf 'SMTP_USER=%s\n' "$SMTP_USER"
              printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            } > /tmp/hirenow.env
            sudo install -m 600 /tmp/hirenow.env /opt/hirenow/.env
            rm -f /tmp/hirenow.env

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            sudo docker pull "$IMAGE_NAME:latest"
            sudo docker stop hirenow || true
            sudo docker rm hirenow || true
            sudo docker run -d \
              --name hirenow \
              --restart unless-stopped \
              -p 3100:80 \
              --env-file /opt/hirenow/.env \
              "$IMAGE_NAME:latest"
